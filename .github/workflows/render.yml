name: Render Remotion Video

on: [push, workflow_dispatch]

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Chromium dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64

      - name: Install and Render Video
        run: |
          # Automatically find the folder containing package.json and src/
          PROJECT_DIR=$(dirname $(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1))
          echo "Found project in: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          # Install dependencies and ensure @remotion/cli is present
          npm install
          npm install --no-save @remotion/cli

          # Render using @remotion/cli (auto-detects entry point and first composition if Main isn't found)
          npx @remotion/cli render src/index.ts ExpiredPillsVideo out/video.mp4 || npx @remotion/cli render src/index.ts Main out/video.mp4 || npx @remotion/cli render out/video.mp4

      - name: Upload Rendered Video
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: |
            **/out/video.mp4
            **/*.mp4
            !**/public/*.mp4
