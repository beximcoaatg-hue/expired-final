name: Render Remotion Video

on: [push, workflow_dispatch]

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Chromium dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2

      - name: Install and Render Video
        run: |
          if [ -f "remotion-expired-pills/package.json" ]; then
            cd remotion-expired-pills
          fi
          npm install
          npx remotion render Main out/video.mp4

      - name: Upload Rendered Video
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: |
            out/video.mp4
            remotion-expired-pills/out/video.mp4
